name: CI

on:
  push:
    branches: [ main, develop, '[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  release-version:
    name: Release version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check:release-version
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}

  date-timezones:
    name: Date tests (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, America/New_York, Asia/Colombo]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: >-
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage=false
          --include=lib/utils/date.utils.spec.ts
          --include=lib/utils/recurring-dates.utils.spec.ts
          --include=lib/utils/timezone.utils.spec.ts

  focus-ring:
    name: Browser focus ring regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -- ngxsmk-datepicker --configuration development
      - run: npm run e2e -- focus-ring.spec.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  test-coverage:
    name: Test (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build
    needs: release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:optimized
      - name: Bundle size budget
        run: npm run check:bundle-budget
        env:
          NGXSMK_BUNDLE_BUDGET_KB: '1150'
